[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["tsod/**/*"]

[project]
name = "tsod"
version = "0.3.dev0"
description = "Time series anomaly detection."
authors = [{ name = "Henrik Andersson", email = "jan@dhigroup.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=1.0.0", "joblib", "numba", "typing_extensions"]

classifiers = [
    "License :: OSI Approved :: MIT License",
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = [
    "ruff==0.14.5",
    "pytest>=6",
    "pytest-cov>=4",
    "sphinx<7,>=4",
    "sphinx-book-theme",
    "pandas-stubs",
]

[project.urls]
"Homepage" = "https://github.com/DHI/tsod"
"Bug Tracker" = "https://github.com/DHI/tsod/issues"


[tool.ruff.lint]

# ignore long lines
ignore = ["E501", "E741", "PD011"]

select = [
    # ruff defaults
    "E4",
    "E7",
    "E9",
    "F",
    # ruff defaults
    # TODO deal with docstring issues in a future PR
    #"D100",
    #"D101",
    #"D102",
    #"D103",
    #"D202",
    #"D212",
    #"D413",
    #"D415",
    #"D417",
    "NPY",
    "PD",
]
